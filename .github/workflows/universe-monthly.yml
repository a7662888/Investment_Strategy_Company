name: Universe Monthly Refresh

# 每月自動重算唯一正式決策來源的母池（規則式，預設 200 檔）並 commit。
# model_artifacts/** 不觸發 Render 部署，所以同時寫入私有資料庫，網站才讀得到新母池。
# 時區:cron 為 UTC。每月 1 日 16:00 UTC ≈ 台灣隔日 00:00。
on:
  schedule:
    - cron: "0 16 1 * *"
  workflow_dispatch: {}      # 也可在 GitHub Actions 頁手動觸發

permissions:
  contents: write

concurrency:
  group: universe-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet pandas requests
      - name: Refresh investable mother pool (月更:規則式母池)
        timeout-minutes: 25
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}   # 選填;沒有也能跑(匿名,較易被限流)
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
        run: python run_universe_refresh.py pool
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_artifacts/active_pool.json
          if git diff --cached --quiet; then
            echo "名單無變化,略過。"
          else
            git commit -m "chore(universe): 自動月更母池"
            git pull --rebase origin main
            git push origin main
          fi
