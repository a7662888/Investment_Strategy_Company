name: Broker Research Refresh

# Owner-requested read-only repair/bootstrap; scheduled updates remain in email-daily.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only account diagnosis or inventory/rankings refresh
        type: choice
        options: [refresh, diagnose]
        default: refresh

permissions:
  contents: read

concurrency:
  group: daily-investment-analysis-email
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet shioaji
      - name: Read account metadata only (no inventory or storage writes)
        if: inputs.mode == 'diagnose'
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
        run: python run_broker_positions.py --diagnose
      - name: Read private broker inventory
        if: inputs.mode != 'diagnose'
        continue-on-error: true
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
        run: python run_broker_positions.py --fetch
      - name: Read last completed session rankings
        if: inputs.mode != 'diagnose'
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
        run: python run_market_scanners.py
