name: Daily Email Digest

# 每交易日 16:35 台北（08:35 UTC）先重算母池100＋ETF子池，再依私有持股寄摘要。
# 全程在 GitHub runner 執行，不需開網站或開啟本機；每日輸入另存私有 audit 快照。

on:
  schedule:
    - cron: "35 8 * * 1-5"
  workflow_dispatch: {}

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: daily-investment-analysis-email
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard - required secrets must exist
        env:
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          test -n "$GITHUB_DATA_TOKEN"
          test -n "$EMAIL_ADDRESS"
          test -n "$SMTP_APP_PASSWORD"

      # 券商盤後快照必須先跑：它是 close-of-record 的補充來源，交易所 OpenAPI
      # 常延遲一至兩個交易日，沒有它的話下一步算出來的狀態會落後（實測曾落後 2 日）。
      - name: Install broker data client
        run: pip install --quiet shioaji

      - name: Post-close broker snapshot (close-of-record)
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
        # 快照失敗不得讓整條管線停擺：交易所 feed 仍是可用退路，
        # 只是資料會回到原本的落後狀態，而不是整天沒有資料。
        continue-on-error: true
        run: python run_shioaji_snapshot.py

      - name: Refresh daily value state (mother pool + ETF subpool)
        env:
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python run_daily_value_state.py

      # ETF 規模／資金流／折溢價（證交所 MIS）＋同日成交值與價差（永豐快照）→
      # 研究候選與停扣檢查。失敗不得擋住每日 Email。
      - name: ETF metrics and research screen
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
        continue-on-error: true
        run: python run_etf_metrics.py

      - name: Read broker inventory (never replace manual portfolio)
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
        continue-on-error: true
        run: python run_broker_positions.py --fetch

      # 關注清單分 K（盤後一次，只抓清單內標的）→ 假跌破與成交價研究；失敗不擋 Email。
      - name: Watchlist kbars and timing research
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
        continue-on-error: true
        run: python run_kbars.py

      - name: Save post-close market scanners (research only)
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
        continue-on-error: true
        run: python run_market_scanners.py

      # 處置股／注意股（公開監理資訊，不碰帳務），供網站標示風險；失敗不擋 Email。
      - name: Save regulatory lists (disposition / attention)
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
        continue-on-error: true
        run: python run_regulatory.py

      - name: Freeze changed decisions after fresh analysis
        env:
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        # exit 2 = 少數檔取數失敗（沿用舊卡），其餘正常；不擋後續結果更新與 Email。
        run: |
          rc=0; python run_value_rescreen.py || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Update outcomes after fresh decisions
        env:
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
        run: python run_ledger_outcomes.py

      - name: Send fresh, auditable daily digest
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          STOCK_POSITIONS: ${{ secrets.STOCK_POSITIONS }}
          GITHUB_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GITHUB_DATA_REPO: a7662888/investment-strategy-data
          GITHUB_DATA_BRANCH: main
        run: python run_daily_email.py

      # 盤後狀態更新後順手喚醒網站：非交易日補跑時，網站會接著產生「下一交易日盤前預覽」；
      # 交易日當天簡報已存在，這一步不會重做任何事。
      - name: Chain next steps on the site (premarket preview after catch-up)
        if: always()
        continue-on-error: true
        run: curl -sS --max-time 120 -o /dev/null -w "%{http_code}\n" https://investment-strategy-company.onrender.com/api/daily-refresh
