services:
  - type: web
    name: investment-strategy-company
    env: python
    buildCommand: ""
    startCommand: python app.py $PORT 0.0.0.0
    healthCheckPath: /api/health/ready
    plan: free
    autoDeploy: true
    buildFilter:
      paths:
        - "app.py"
        - "requirements.txt"
        - "company/**"
        - "web/**"
        # 服務設定本身變更也要能觸發部署，否則改了 envVars 卻不會生效。
        - "render.yaml"
      ignoredPaths:
        - "model_artifacts/**"
        - "data/**"
        - "data_cache/**"
        - "reports/**"
        - "*.md"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GITHUB_DATA_REPO
        sync: false
      - key: GITHUB_DATA_TOKEN
        sync: false
      - key: GITHUB_DATA_BRANCH
        value: main
      # 2026-08-31 曝露事件後，持股同步以 fail-closed 方式關閉。
      # 2026-09-01 業主指示重新開啟，開啟前已核驗 gate 自身載明的前提
      # 「durable repo is verified private」：private=True、forks/watchers/stars 皆 0、
      # 匿名 repo API 與 raw 持股路徑均回 404。
      # 本旗標只解除 503 閘門，不解除授權：/api/positions 仍需正確 bearer token，否則 401。
      - key: POSITIONS_SYNC_ENABLED
        value: "1"
