services:
  - type: web
    name: investment-strategy-company
    env: python
    buildCommand: ""
    startCommand: python app.py $PORT 0.0.0.0
    healthCheckPath: /api/health/ready
    plan: free
    autoDeploy: true
    buildFilter:
      paths:
        - "app.py"
        - "requirements.txt"
        - "company/**"
        - "web/**"
        # 服務設定本身變更也要能觸發部署，否則改了 envVars 卻不會生效。
        - "render.yaml"
      ignoredPaths:
        - "model_artifacts/**"
        - "data/**"
        - "data_cache/**"
        - "reports/**"
        - "*.md"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GITHUB_DATA_REPO
        sync: false
      - key: GITHUB_DATA_TOKEN
        sync: false
      - key: GITHUB_DATA_BRANCH
        value: main
      # 注意：本服務並非 Blueprint 管理，這裡的 envVars 實測不會套用到執行環境
      # （2026-09-01 驗證：宣告 POSITIONS_SYNC_ENABLED=1 後，執行期仍讀不到）。
      # 因此持股同步的開關改由 app.positions_sync_enabled() 的程式預設決定，
      # 緊急關閉請用 POSITIONS_SYNC_ENABLED=0 或 POSITIONS_SYNC_DISABLED=1
      # ——但同樣須經 Render 後台設定才會生效。
